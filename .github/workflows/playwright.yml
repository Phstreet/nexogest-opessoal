name: Testes E2E do NEXO

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nexogest-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Executar testes Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar relatório detalhado de vulnerabilidades npm
        run: npm audit --json > npm-audit-report.json || true

      - name: Salvar relatório npm audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-npm-audit
          path: npm-audit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Validar vulnerabilidades das dependências de produção
        run: npm audit --omit=dev --audit-level=low

      - name: Relatar vulnerabilidades de ferramentas de desenvolvimento
        continue-on-error: true
        run: npm audit --audit-level=low

      - name: Validar lint
        run: npm run lint

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Executar testes unitários de domínio
        run: npm run test

      - name: Validar build de produção
        run: npm run build

      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Salvar relatório Playwright
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
