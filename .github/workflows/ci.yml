name: NEXO CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (typecheck, lint e build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build de produção
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build de produção para E2E
        run: npm run build
      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E em produção
        run: npm run test:e2e
      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  seguranca:
    name: Segurança (dependências e segredos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rls_isolation:
    name: RLS (JWT A/B — DEV)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/security/relational-auth-hardening') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'security/relational-auth-hardening') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Testar isolamento RLS com JWT A/B no NEXO-DEV
        run: node scripts/security/rls-isolation.mjs
        env:
          NEXO_DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXO_DEV_SUPABASE_SERVICE_ROLE_KEY }}
          NEXO_DEV_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXO_DEV_SUPABASE_PUBLISHABLE_KEY }}
